    <script>
      (() => {
        const saved = localStorage.getItem('northdev-theme');
        const theme = saved === 'light' ? 'light' : 'dark';
        const dark = theme === 'dark';

        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = theme;
        document.getElementById('theme-color')?.setAttribute('content', dark ? '#05070c' : '#edf3fa');

        const imageBase = `/images/northdev-system-core-${theme}`;
        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.type = 'image/webp';
        preload.href = `${imageBase}-1024.webp`;
        preload.setAttribute('fetchpriority', 'high');
        preload.setAttribute('imagesrcset', `${imageBase}-640.webp 640w, ${imageBase}-1024.webp 1024w, ${imageBase}-1729.webp 1729w`);
        preload.setAttribute('imagesizes', '(max-width: 639px) 100vw, (max-width: 1023px) calc(100vw - 3.5rem), 54vw');
        document.head.appendChild(preload);
      })();
    </script>
